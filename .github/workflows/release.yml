# Cuts a release whenever main carries a version that has no tag yet.
# Bump `version` in package.json and merge to release; `gh release create`
# makes the tag, so no tag push or personal token is needed.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          tag="v$(jq -r .version package.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists; nothing to release."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $tag."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: version
    if: needs.version.outputs.new == 'true'
    uses: ./.github/workflows/ci.yml

  # Each target builds on its own platform: bun install fetches only that
  # platform's @opentui/core native library, and the binary embeds it.
  build:
    needs: [version, check]
    strategy:
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
          - target: darwin-x64
            os: macos-15-intel
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Build
        run: |
          # Unversioned names keep releases/latest/download URLs stable.
          name="vago-$TARGET"
          mkdir "$name"
          bun build.ts "$name/vago"
          "$name/vago" --help > /dev/null
          cp README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: vago-*.tar.gz*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

  homebrew:
    needs: [version, release]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      # HOMEBREW_TAP_KEY is the private half of a write deploy key on julianbonomini/homebrew-tap.
      - env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
        run: |
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:julianbonomini/homebrew-tap.git tap
          mkdir -p tap/Formula
          sh scripts/homebrew-formula.sh "${TAG#v}" dist > tap/Formula/vago.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/vago.rb
          git commit -m "Update vago to $TAG"
          git push
