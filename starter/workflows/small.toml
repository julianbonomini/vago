# The small Workflow, for a Goal whose Tickets are small and already clear:
# one agent builds each Ticket and a fresh one reviews it. Pick it with
# `vago goal new <goal> --workflow small`. Prompt paths resolve from .vago/,
# include paths from the repo root, and shell commands run in the Goal's
# worktree.
#
# Git: Vago runs each Goal in its own worktree on the Goal's branch,
# vago/<goal>, which Vago cuts from the repo's default branch and owns.
# This Workflow builds each Ticket on <goal>/<ticket>, cut from vago/<goal>,
# and squash-merges it back as one commit. The human merges the Goal's PR.
# Shell Steps get the names in $VAGO_GOAL and $VAGO_TICKET, and
# $VAGO_LAST_TICKET is true when every other Ticket of the Goal is done, and
# $VAGO_PROJECT_ROOT is the main checkout's path.
#
# A Step's name is what the TUI and `vago run` show. Its id is what
# {{steps.<id>.output}} and log file names use, and a Step without a name
# shows its id.

harness = "claude-code"
model   = "claude-opus-5-5"
# args = []             # appended to the claude command; a Step can set its own
idle_timeout = "10m"  # how long claude may print nothing before the Run fails

[[steps]]
id   = "branch"
name = "New branch"
type = "shell"
run  = "sh .vago/scripts/branch.sh"

[[steps]]
id     = "implement"
name   = "Build"
type   = "agent"
prompt = "prompts/small-implement.md"

[[steps]]
id      = "check"
name    = "Checks"
type    = "shell"
run     = "bun run check"
on_fail = "continue"   # review reads a failed check and fixes it

[[steps]]
id     = "review"
name   = "Review"
type   = "agent"
prompt = "prompts/small-review.md"

[[steps]]
id     = "goal-review"
name   = "Goal review"
type   = "agent"
prompt = "prompts/goal-review.md"
when   = "last-ticket"   # skipped on every other Ticket

[[steps]]
id   = "merge"
name = "Squash merge"
type = "shell"
run  = "sh .vago/scripts/merge.sh"
