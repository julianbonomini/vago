# The Steps every Ticket goes through, in order. `vago init` copied this
# file from Vago's starter, and it's yours to change. Prompt paths resolve
# from .vago/, include and shell paths from the repo root.
#
# Git: each Goal has a branch, goal/<goal>, cut from main by its first Ticket.
# Each Ticket is built on <goal>/<ticket>, cut from the Goal's branch, and
# squash-merged back as one commit. The human merges the Goal's PR to main.
# Shell Steps get the names in $VAGO_GOAL and $VAGO_TICKET, and
# $VAGO_LAST_TICKET is true when every other Ticket of the Goal is done.

harness = "claude-code"
model   = "claude-opus-5-5"
# args = []             # appended to the claude command; a Step can set its own
idle_timeout = "10m"  # how long claude may print nothing before the Run fails

[[steps]]
id   = "branch"
type = "shell"
run  = "sh .vago/scripts/branch.sh"

[[steps]]
id     = "design"
type   = "agent"
prompt = "prompts/design.md"
include.aposd = ".vago/rules/aposd.md"
include.style = ".vago/rules/code-style.md"

[[steps]]
id     = "product"
type   = "agent"
prompt = "prompts/product.md"

[[steps]]
id     = "architecture"
type   = "agent"
prompt = "prompts/architecture.md"
include.aposd = ".vago/rules/aposd.md"
include.style = ".vago/rules/code-style.md"

[[steps]]
id     = "implement"
type   = "agent"
prompt = "prompts/implement.md"
include.aposd = ".vago/rules/aposd.md"
include.style = ".vago/rules/code-style.md"

[[steps]]
id      = "check"
type    = "shell"
run     = "bun run check"
on_fail = "continue"   # review reads a failed check and fixes it

[[steps]]
id     = "review"
type   = "agent"
prompt = "prompts/review.md"
include.aposd = ".vago/rules/aposd.md"
include.style = ".vago/rules/code-style.md"

[[steps]]
id   = "merge"
type = "shell"
run  = "bun run check && sh .vago/scripts/merge.sh"
