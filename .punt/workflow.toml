# Punt's own Workflow: the starter, plus Punt's repo knowledge
# (docs/architecture.md, CONTEXT.md, docs/adr/) included where a Step needs
# it. Prompt paths resolve from .punt/, include and shell paths from the repo
# root. When an ADR is added, add it to the Steps that list the others.
#
# Git: each Goal has a branch, goal/<goal>, cut from main by its first Ticket.
# Each Ticket is built on <goal>/<ticket>, cut from the Goal's branch, and
# squash-merged back as one commit. The human merges the Goal's PR to main.
# Shell Steps get the names in $PUNT_GOAL and $PUNT_TICKET.

harness = "claude-code"
model   = "claude-opus-5-5"
# args = []             # appended to the claude command; a Step can set its own
idle_timeout = "10m"  # how long claude may print nothing before the Run fails

[[steps]]
id   = "branch"
type = "shell"
run  = "sh .punt/scripts/branch.sh"

[[steps]]
id     = "design"
type   = "agent"
prompt = "prompts/design.md"
include.aposd        = ".punt/rules/aposd.md"
include.style        = ".punt/rules/code-style.md"
include.architecture = "docs/architecture.md"
include.context      = "CONTEXT.md"
include.adr-0001     = "docs/adr/0001-typescript-on-bun-driving-harness-clis.md"
include.adr-0002     = "docs/adr/0002-kernel-owns-no-git-and-no-workspace.md"
include.adr-0003     = "docs/adr/0003-tickets-are-untracked-files-only-alpha-writes-status.md"

[[steps]]
id     = "product"
type   = "agent"
prompt = "prompts/product.md"
include.context = "CONTEXT.md"

[[steps]]
id     = "architecture"
type   = "agent"
prompt = "prompts/architecture.md"
include.aposd        = ".punt/rules/aposd.md"
include.style        = ".punt/rules/code-style.md"
include.architecture = "docs/architecture.md"
include.adr-0001     = "docs/adr/0001-typescript-on-bun-driving-harness-clis.md"
include.adr-0002     = "docs/adr/0002-kernel-owns-no-git-and-no-workspace.md"
include.adr-0003     = "docs/adr/0003-tickets-are-untracked-files-only-alpha-writes-status.md"

[[steps]]
id     = "implement"
type   = "agent"
prompt = "prompts/implement.md"
include.aposd        = ".punt/rules/aposd.md"
include.style        = ".punt/rules/code-style.md"
include.architecture = "docs/architecture.md"

[[steps]]
id      = "check"
type    = "shell"
run     = "bun run check"
on_fail = "continue"   # review reads a failed check and fixes it

[[steps]]
id     = "review"
type   = "agent"
prompt = "prompts/review.md"
include.aposd        = ".punt/rules/aposd.md"
include.style        = ".punt/rules/code-style.md"
include.architecture = "docs/architecture.md"

[[steps]]
id   = "merge"
type = "shell"
run  = "bun run check && sh .punt/scripts/merge.sh"
